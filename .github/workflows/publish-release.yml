name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.2)'
        required: false
        type: string
      release_name:
        description: 'Release Title'
        required: false
        type: string
      alias:
        description: 'Key Alias'
        required: false
        type: string
      keystore_password:
        description: 'Keystore Password'
        required: false
        type: string
      key_password:
        description: 'Key Password (if different from keystore password)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Release APK
        env:
          KEYSTORE_PATH: release.keystore
          KEY_ALIAS: ${{ inputs.alias || secrets.ALIAS || secrets.KEY_ALIAS || 'key0' }}
          KEYSTORE_PASSWORD: ${{ inputs.keystore_password || secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ inputs.key_password || secrets.KEY_PASSWORD || inputs.keystore_password || secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Keystore password is not provided via input or secret!"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"

          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::Unsigned APK not found in app/build/outputs/apk/release"
            exit 1
          fi

          echo "Found unsigned APK: $UNSIGNED_APK"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED_APK="app/build/outputs/apk/release/RenameAPPs-release.apk"

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$SIGNED_APK"
          echo "SIGNED_APK_PATH=$SIGNED_APK" >> $GITHUB_ENV

      - name: Determine Release Tag and Name
        id: vars
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.1-$(date +'%Y%m%d%H%M%S')"
          fi

          if [ -n "${{ inputs.release_name }}" ]; then
            NAME="${{ inputs.release_name }}"
          else
            NAME="Release $TAG"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.SIGNED_APK_PATH }}